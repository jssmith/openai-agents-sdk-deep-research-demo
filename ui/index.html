<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Research Agent</title>
    <link rel="stylesheet" href="static/src/css/styles.css">
</head>
<body class="chat-page">

    <div class="content-section">
        <header class="app-header">
            <h1 class="main-heading">Deep Research Agent</h1>
            <div class="app-header-actions">
                <p class="agent-status" id="agentStatus">
                    <span class="agent-status-dot"></span>
                    <span>Ready</span>
                </p>
                <button
                    type="button"
                    class="reset-button"
                    id="resetButton"
                    aria-label="Start a new research request"
                    title="Start a new research request"
                >
                    <img src="static/public/icons/start-over.svg" alt="" aria-hidden="true">
                </button>
            </div>
        </header>

        <div class="chat-container" id="chatContainer">
            <div class="message bot">
                <div class="message-bubble bot">
                    What would you like me to research?
                </div>
            </div>

            <div class="message bot spinner-message" id="spinnerContainer" style="display: none;">
                <div class="agent-status-message agent-thinking-message">
                    <svg class="spinner" xmlns="http://www.w3.org/2000/svg" width="35" height="35" viewBox="0 0 35 35" fill="none">
                        <g clip-path="url(#clip0_18_726)">
                            <path d="M8.34424 21.388C7.50043 19.4773 7.28314 17.3486 7.72353 15.3068C8.16393 13.2651 9.23938 11.4151 10.7958 10.0222C12.3522 8.6292 14.3096 7.76469 16.3875 7.55256C18.4654 7.34042 20.5571 7.79155 22.3629 8.84127C24.1686 9.891 25.5957 11.4854 26.4396 13.3961C27.2835 15.3067 27.5009 17.4355 27.0606 19.4773C26.6203 21.519 25.5449 23.369 23.9886 24.762C22.4323 26.1551 20.4749 27.0197 18.397 27.2319" stroke="#00C950" stroke-width="2.19796" stroke-linecap="round" stroke-linejoin="round"/>
                        </g>
                        <defs>
                            <clipPath id="clip0_18_726">
                                <rect width="26.3755" height="26.3755" fill="white" transform="translate(34.7835 24.127) rotate(156.169)"/>
                            </clipPath>
                        </defs>
                    </svg>
                    <span>
                        <strong class="researching-text">Agent is thinking...</strong>
                    </span>
                </div>
            </div>
        </div>

        <!-- Input Container -->
        <div class="input-container">
            <div class="input-wrapper">
                <input type="text" class="user-input" placeholder="Reply...">
                <button class="submit-button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none">
                        <path d="M3.33301 7.99992L7.99967 3.33325L12.6663 7.99992" stroke="white" stroke-width="1.33333" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M8 12.6666V3.33325" stroke="white" stroke-width="1.33333" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script src="static/public/vendor/marked-15.0.7.min.js"></script>
    <script src="static/src/js/api-client.js"></script>
    <script src="static/src/js/report.js"></script>
    <script>
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.querySelector('.user-input');
        const submitButton = document.querySelector('.submit-button');
        const spinnerContainer = document.getElementById('spinnerContainer');
        const researchingText = document.querySelector('.researching-text');
        const agentStatus = document.getElementById('agentStatus');
        const resetButton = document.getElementById('resetButton');
        const INITIAL_PLACEHOLDER = userInput.placeholder;
        const POST_COMPLETE_PLACEHOLDER = 'Start a new research request...';
        const WORKFLOW_QUERY_PARAM = 'wf';
        const OPENING_QUESTION = 'What would you like me to research?';
        const REQUIRED_ANSWERS = 2;

        // The workflow id lives in the URL (?wf=...), so a reload resumes the
        // same run; the workflow itself holds the conversation.
        let workflowId = null;
        let pendingElicitation = null;            // {id, message} or null
        const renderedElicitationIds = new Set(); // ids of elicitations whose Q has been rendered
        let researchComplete = false;
        let researchingStarted = false;
        let reportRendered = false;
        let submitting = false;
        let slowSpinnerTimer = null;
        // Generation token: starting over bumps it, and any in-flight request
        // or poll loop from an older generation drops its response instead of
        // repainting the conversation.
        let generation = 0;

        function workflowIdFromURL() {
            const id = new URLSearchParams(window.location.search).get(WORKFLOW_QUERY_PARAM);
            return id && id.trim() ? id.trim() : null;
        }

        function setWorkflowURL(id) {
            const url = new URL(window.location.href);
            if (id) {
                url.searchParams.set(WORKFLOW_QUERY_PARAM, id);
            } else {
                url.searchParams.delete(WORKFLOW_QUERY_PARAM);
            }
            history.pushState({ workflowId: id || null }, '', url.pathname + url.search);
        }

        // Progress card text. The agent may supply topic-specific labels
        // (progress_plan); these fixed labels are used otherwise.
        const AGENT_STATUS_MESSAGES = {
            planning: {
                title: 'Planning the research scope',
                detail: 'Clarifications saved. Starting the agent run.',
            },
            collecting: {
                title: 'Gathering evidence',
                detail: 'Web research, supporting data, and a research visual.',
            },
            writing: {
                title: 'Writing the final report',
                detail: 'Summary, visualization, and markdown are being assembled.',
            },
        };
        const PHASES = ['planning', 'collecting', 'writing'];

        let agentProgressPlan = null;

        function statusMessageFor(id) {
            return (agentProgressPlan && agentProgressPlan[id]) || AGENT_STATUS_MESSAGES[id];
        }

        function setAgentStatus(text, complete = false) {
            agentStatus.innerHTML = `
                <span class="agent-status-dot${complete ? ' complete' : ''}"></span>
                <span>${escapeHTML(text)}</span>
            `;
        }

        function addMessage(text, isUser = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;

            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = `message-bubble ${isUser ? 'user' : 'bot'}`;
            bubbleDiv.textContent = text;

            messageDiv.appendChild(bubbleDiv);
            chatContainer.appendChild(messageDiv);
            keepSpinnerAtBottom();
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Rendered status cards by phase, so labels that arrive after a card
        // was rendered can update it in place.
        const renderedStatusNodes = new Map();

        function statusCardHTML(status) {
            return `
                <span class="agent-status-icon">✓</span>
                <span>
                    <strong>${escapeHTML(status.title)}</strong>
                    <span class="agent-status-detail">${escapeHTML(status.detail)}</span>
                </span>
            `;
        }

        function addStatusMessage(phase) {
            const status = statusMessageFor(phase);
            const existing = renderedStatusNodes.get(phase);
            if (existing) {
                existing.innerHTML = statusCardHTML(status);
                return;
            }

            const messageDiv = document.createElement('div');
            messageDiv.className = 'message bot';
            const statusDiv = document.createElement('div');
            statusDiv.className = 'agent-status-message';
            statusDiv.innerHTML = statusCardHTML(status);
            renderedStatusNodes.set(phase, statusDiv);
            messageDiv.appendChild(statusDiv);
            chatContainer.appendChild(messageDiv);
            keepSpinnerAtBottom();
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Render cards for every phase up to and including the current one.
        function showPhasesThrough(phase) {
            const last = PHASES.indexOf(phase);
            PHASES.slice(0, last + 1).forEach(addStatusMessage);
        }

        function keepSpinnerAtBottom() {
            if (spinnerContainer.style.display !== 'none') {
                chatContainer.appendChild(spinnerContainer);
            }
        }

        function addReportCard(result) {
            if (reportRendered) return;
            // Render first: if it throws, nothing is shown yet and the next
            // poll tries again.
            const reportHTML = renderMarkdown(result.markdown_report);

            const messageDiv = document.createElement('div');
            messageDiv.className = 'message bot report-message';

            const card = document.createElement('article');
            card.className = 'report-card';
            card.tabIndex = 0;
            card.setAttribute('role', 'button');
            card.setAttribute('aria-expanded', 'false');

            // No image path means generation was unavailable: show the placeholder.
            const imageHTML = result.image_file_path
                ? `<img class="report-card-image" src="${escapeHTML(result.image_file_path)}" alt="AI-generated research visualization">`
                : '<div class="report-card-image report-card-image-placeholder">Report</div>';

            card.innerHTML = `
                <div class="report-card-main">
                    ${imageHTML}
                    <div class="report-card-copy">
                        <span class="report-card-eyebrow">Report ready</span>
                        <h2>${escapeHTML(titleFromMarkdown(result.markdown_report, 'Research summary'))}</h2>
                        <p>${escapeHTML(result.short_summary)}</p>
                    </div>
                </div>
                <div class="report-card-action">
                    <span>Open markdown report</span>
                    <span class="report-card-arrow">↗</span>
                </div>
                <div class="report-panel" hidden>
                    <div class="report-panel-actions">
                        <button type="button" class="report-download-btn">Download markdown</button>
                        <a href="success?wf=${encodeURIComponent(workflowId)}" class="report-full-link">Open full page</a>
                    </div>
                    <div class="markdown-content compact"></div>
                </div>
            `;

            const panel = card.querySelector('.report-panel');
            card.querySelector('.markdown-content').innerHTML = reportHTML;

            function toggleReport() {
                const isOpen = !panel.hidden;
                panel.hidden = isOpen;
                card.setAttribute('aria-expanded', String(!isOpen));
                document.body.classList.toggle('report-open', !isOpen);
                if (!isOpen) {
                    setTimeout(() => {
                        card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                    }, 0);
                }
            }

            card.addEventListener('click', (event) => {
                if (event.target.closest('a') || event.target.closest('button')) return;
                // Allow normal interaction (text selection, clicks) inside the
                // expanded panel; only the collapsed surface toggles the card.
                if (event.target.closest('.report-panel')) return;
                toggleReport();
            });

            card.addEventListener('keydown', (event) => {
                if (event.target !== card) return;
                if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    toggleReport();
                }
            });

            const runId = workflowId;
            card.querySelector('.report-download-btn').addEventListener('click', (event) => {
                event.stopPropagation();
                downloadMarkdown(result.markdown_report, runId);
            });

            addMessage('I finished the research. The report is ready to review.');
            messageDiv.appendChild(card);
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            reportRendered = true;
        }

        function setResearchComplete(complete) {
            researchComplete = complete;
            document.body.classList.toggle('research-complete', complete);
            userInput.placeholder = complete ? POST_COMPLETE_PLACEHOLDER : INITIAL_PLACEHOLDER;
        }

        // Show/hide the spinner. After 5s of continuous waiting it turns amber
        // ("Still researching..."), a generic "this is taking a while" signal
        // that also covers the worker-restart moment.
        function showSpinner(visible, text = 'Agent is thinking...') {
            clearTimeout(slowSpinnerTimer);
            spinnerContainer.classList.remove('retrying');
            spinnerContainer.style.display = visible ? 'flex' : 'none';
            if (!visible) return;

            researchingText.textContent = text;
            chatContainer.appendChild(spinnerContainer);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            slowSpinnerTimer = setTimeout(() => {
                spinnerContainer.classList.add('retrying');
                researchingText.textContent = 'Still researching...';
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 5000);
        }

        function startFreshChat() {
            generation += 1;
            workflowId = null;
            pendingElicitation = null;
            researchingStarted = false;
            submitting = false;
            agentProgressPlan = null;
            showSpinner(false);
            setWorkflowURL(null);
            chatContainer.innerHTML = '';
            renderedStatusNodes.clear();
            renderedElicitationIds.clear();
            reportRendered = false;
            document.body.classList.remove('report-open');
            addMessage(OPENING_QUESTION);
            setAgentStatus('Ready');
            setResearchComplete(false);
            userInput.value = '';
            userInput.focus();
        }

        // Rebuild the conversation from the workflow's durable state.
        function renderTranscript(status) {
            addMessage(status.original_query, true);
            status.completed_elicitations.forEach((el) => {
                addMessage(el.message);
                addMessage(el.response, true);
                renderedElicitationIds.add(el.id);
            });
        }

        // Advance the UI to the workflow's current status, then keep polling
        // while the agent works. Polling stops while the agent waits for an
        // answer, and when the run completes or fails.
        async function applyStatus(status, gen) {
            if (status.progress_plan && !agentProgressPlan) {
                agentProgressPlan = status.progress_plan;
                renderedStatusNodes.forEach((_, phase) => addStatusMessage(phase));
            }

            if (status.status === 'failed') {
                showSpinner(false);
                setAgentStatus('Failed');
                addMessage('The research could not be completed. The Temporal UI shows why this workflow failed.');
            } else if (status.status === 'awaiting_user_input') {
                pendingElicitation = status.pending_elicitation;
                setAgentStatus('Needs input');
                showSpinner(false);
                if (!renderedElicitationIds.has(pendingElicitation.id)) {
                    addMessage(pendingElicitation.message);
                    renderedElicitationIds.add(pendingElicitation.id);
                }
            } else if (status.status === 'completed') {
                const result = await researchApi.getResult(workflowId);
                if (gen !== generation) return;
                showSpinner(false);
                showPhasesThrough('writing');
                setAgentStatus('Report ready', true);
                addReportCard(result);
                setResearchComplete(true);
            } else {
                // Researching. Progress cards start once the clarifications
                // are answered; until then the agent is still asking.
                if (status.completed_elicitations.length >= REQUIRED_ANSWERS) {
                    if (!researchingStarted) {
                        researchingStarted = true;
                        setAgentStatus('Researching');
                        showSpinner(true, 'Agent is researching...');
                    }
                    showPhasesThrough(status.current_activity);
                } else if (spinnerContainer.style.display === 'none') {
                    setAgentStatus('Thinking');
                    showSpinner(true);
                }
                setTimeout(() => pollStatus(gen), 1000);
            }
        }

        // Fetch the workflow's status and apply it. On a reload the transcript
        // is first rebuilt from the workflow. A transient error (e.g. no
        // worker to answer the status query while it restarts) keeps the
        // run's identity and retries; only an unknown workflow is forgotten.
        async function pollStatus(gen, rebuildTranscript = false) {
            if (gen !== generation) return;
            try {
                const status = await researchApi.getStatus(workflowId);
                if (gen !== generation) return;
                if (rebuildTranscript && status.status !== 'failed') {
                    renderTranscript(status);
                    rebuildTranscript = false;
                }
                await applyStatus(status, gen);
            } catch (error) {
                if (gen !== generation) return;
                if (error.status === 404) {
                    forgetMissingWorkflow();
                    return;
                }
                console.error('Status error:', error);
                setTimeout(() => pollStatus(gen, rebuildTranscript), 2000);
            }
        }

        function forgetMissingWorkflow() {
            startFreshChat();
            addMessage('That research run was not found. Ask a new question to start again.');
        }

        async function handleSubmit() {
            const text = userInput.value.trim();
            if (!text || submitting) return;
            if (researchComplete) {
                startFreshChat();
            }
            if (workflowId && !pendingElicitation) return; // the agent is working

            submitting = true;
            const gen = generation;
            addMessage(text, true);
            userInput.value = '';
            showSpinner(true);
            setAgentStatus('Thinking');

            try {
                if (!workflowId) {
                    const started = await researchApi.startResearch(text);
                    if (gen !== generation) return;
                    workflowId = started.workflow_id;
                    setWorkflowURL(workflowId);
                } else {
                    const elicitation = pendingElicitation;
                    pendingElicitation = null;
                    await researchApi.submitElicitationResponse(workflowId, elicitation.id, text);
                    if (gen !== generation) return;
                }
                pollStatus(gen);
            } catch (error) {
                if (gen !== generation) return;
                console.error('Submit error:', error);
                showSpinner(false);
                addMessage('Sorry, something went wrong. Please try again.');
                // Re-read the workflow so a still-pending question can be answered.
                if (workflowId) pollStatus(gen);
            } finally {
                if (gen === generation) submitting = false;
            }
        }

        submitButton.addEventListener('click', handleSubmit);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleSubmit();
            }
        });
        resetButton.addEventListener('click', startFreshChat);

        document.addEventListener('DOMContentLoaded', () => {
            workflowId = workflowIdFromURL();
            if (!workflowId) return;
            // Keep the opening question; the rest is rebuilt from the workflow.
            showSpinner(true);
            pollStatus(generation, true);
        });
    </script>
</body>
</html>
