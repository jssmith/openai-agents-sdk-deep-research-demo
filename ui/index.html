<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Research Agent</title>
    <link rel="stylesheet" href="static/src/css/styles.css">
</head>
<body class="chat-page">
    <canvas id="gradient-canvas"></canvas>
    <div class="full-overlay"></div>

    <div class="content-section">
        <header class="app-header">
            <h1 class="main-heading">Deep Research Agent</h1>
            <div class="app-header-actions">
                <p class="agent-status" id="agentStatus">
                    <span class="agent-status-dot"></span>
                    <span>Ready</span>
                </p>
                <button
                    type="button"
                    class="reset-button"
                    id="resetButton"
                    aria-label="Start a new research request"
                    title="Start a new research request"
                >
                    <img src="static/public/icons/start-over.svg" alt="" aria-hidden="true">
                </button>
            </div>
        </header>

        <div class="chat-container" id="chatContainer">
            <div class="message bot">
                <div class="message-bubble bot">
                    What would you like me to research?
                </div>
            </div>

            <div class="message bot spinner-message" id="spinnerContainer" style="display: none;">
                <div class="agent-status-message agent-thinking-message">
                    <svg class="spinner" xmlns="http://www.w3.org/2000/svg" width="35" height="35" viewBox="0 0 35 35" fill="none">
                        <g clip-path="url(#clip0_18_726)">
                            <path d="M8.34424 21.388C7.50043 19.4773 7.28314 17.3486 7.72353 15.3068C8.16393 13.2651 9.23938 11.4151 10.7958 10.0222C12.3522 8.6292 14.3096 7.76469 16.3875 7.55256C18.4654 7.34042 20.5571 7.79155 22.3629 8.84127C24.1686 9.891 25.5957 11.4854 26.4396 13.3961C27.2835 15.3067 27.5009 17.4355 27.0606 19.4773C26.6203 21.519 25.5449 23.369 23.9886 24.762C22.4323 26.1551 20.4749 27.0197 18.397 27.2319" stroke="#00C950" stroke-width="2.19796" stroke-linecap="round" stroke-linejoin="round"/>
                        </g>
                        <defs>
                            <clipPath id="clip0_18_726">
                                <rect width="26.3755" height="26.3755" fill="white" transform="translate(34.7835 24.127) rotate(156.169)"/>
                            </clipPath>
                        </defs>
                    </svg>
                    <span>
                        <strong class="researching-text">Agent is thinking...</strong>
                    </span>
                </div>
            </div>
        </div>

        <!-- Input Container -->
        <div class="input-container">
            <div class="input-wrapper">
                <input type="text" class="user-input" placeholder="Reply...">
                <button class="submit-button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none">
                        <path d="M3.33301 7.99992L7.99967 3.33325L12.6663 7.99992" stroke="white" stroke-width="1.33333" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M8 12.6666V3.33325" stroke="white" stroke-width="1.33333" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { NeatGradient } from 'https://cdn.jsdelivr.net/npm/@firecms/neat@0.3.0/+esm';

        const neat = new NeatGradient({
            ref: document.getElementById('gradient-canvas'),
            colors: [
                {
                    color: '#444CE7',
                    enabled: true,
                },
                {
                    color: '#141414',
                    enabled: true,
                },
                {
                    color: '#2A2B8A',
                    enabled: true,
                },
                {
                    color: '#F8FAFC',
                    enabled: true,
                },
                {
                    color: '#141414',
                    enabled: false,
                },
            ],
            speed: 0,
            horizontalPressure: 3,
            verticalPressure: 5,
            waveFrequencyX: 2,
            waveFrequencyY: 3,
            waveAmplitude: 5,
            shadows: 0,
            highlights: 2,
            colorBrightness: 1,
            colorSaturation: 3,
            wireframe: false,
            colorBlending: 7,
            backgroundColor: '#141414',
            backgroundAlpha: 1,
            grainScale: 2,
            grainSparsity: 0,
            grainIntensity: 0.5,
            grainSpeed: 1,
            resolution: 1,
        });
    </script>

    <script src="static/src/js/api-client.js"></script>
    <script>
        // ============================================
        // PRODUCTION MODE - Connects to FastAPI backend
        // Backend URL - update this for your environment
        // ============================================
        const API_BASE_URL = 'http://localhost:8234';
        
        const client = new ResearchClient(API_BASE_URL);
        
        // ============================================
        // UI Logic
        // ============================================
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.querySelector('.user-input');
        const submitButton = document.querySelector('.submit-button');
        const spinnerContainer = document.getElementById('spinnerContainer');
        const agentStatus = document.getElementById('agentStatus');
        const resetButton = document.getElementById('resetButton');
        const INITIAL_PLACEHOLDER = userInput.placeholder;
        const POST_COMPLETE_PLACEHOLDER = 'Start a new research request...';
        
        let workflowId = null;
        let pendingElicitation = null;            // {id, message} or null
        const renderedElicitationIds = new Set(); // ids of elicitations whose Q has been rendered
        let spinnerStartTime = null;
        let retryCheckInterval = null;
        let researchComplete = false;
        let researchingStarted = false;
        let reportRendered = false;
        let statusTimers = [];
        // Generation token: each new workflow run / reset bumps this, and any in-flight
        // pollStatus loop bails if its captured generation no longer matches. This stops
        // orphan poll loops from racing a fresh request after the user clicks reset.
        let pollGeneration = 0;
        const renderedStatusMessages = new Set();
        const ACTIVE_WORKFLOW_KEY = 'activeResearchWorkflowId';
        const DEMO_MODE = new URLSearchParams(window.location.search).get('demo');
        const WORKFLOW_QUERY_PARAM = 'wf';

        function workflowIdFromURL() {
            const id = new URLSearchParams(window.location.search).get(WORKFLOW_QUERY_PARAM);
            return id && id.trim() ? id.trim() : null;
        }

        function setWorkflowURL(id) {
            const url = new URL(window.location.href);
            if (id) {
                url.searchParams.set(WORKFLOW_QUERY_PARAM, id);
            } else {
                url.searchParams.delete(WORKFLOW_QUERY_PARAM);
            }
            // pushState avoids a reload; relative path keeps origin and other params intact.
            history.pushState({ workflowId: id || null }, '', url.pathname + url.search);
        }
        // Fallback text used only when the orchestrator hasn't yet committed a
        // topic-specific progress_plan. As soon as the agent's first tool call
        // returns, polled status.progress_plan replaces these.
        const AGENT_STATUS_MESSAGES = [
            {
                id: 'planning',
                title: 'Planning the research scope',
                detail: 'Clarifications saved. Starting the agent run.',
            },
            {
                id: 'collecting',
                title: 'Gathering evidence',
                detail: 'Web research, supporting data, and a research visual.',
            },
            {
                id: 'writing',
                title: 'Writing the final report',
                detail: 'Summary, visualization, and markdown are being assembled.',
            },
        ];

        // Latest progress_plan from the polled status; updated as the agent
        // commits topic-specific labels.
        let agentProgressPlan = null;

        function statusMessageFor(id) {
            if (agentProgressPlan && agentProgressPlan[id]) {
                return {
                    id,
                    title: agentProgressPlan[id].title,
                    detail: agentProgressPlan[id].detail,
                };
            }
            return AGENT_STATUS_MESSAGES.find((m) => m.id === id);
        }

        function setAgentStatus(text, complete = false) {
            agentStatus.innerHTML = `
                <span class="agent-status-dot${complete ? ' complete' : ''}"></span>
                <span>${text}</span>
            `;
        }

        function escapeHTML(value = '') {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function convertMarkdownToHTML(markdown = '') {
            const lines = markdown.split(/\r?\n/);
            const html = [];
            let listOpen = false;

            lines.forEach((line) => {
                const trimmed = line.trim();

                if (!trimmed) {
                    if (listOpen) {
                        html.push('</ul>');
                        listOpen = false;
                    }
                    return;
                }

                if (trimmed.startsWith('# ')) {
                    if (listOpen) html.push('</ul>');
                    listOpen = false;
                    html.push(`<h1>${escapeHTML(trimmed.slice(2))}</h1>`);
                } else if (trimmed.startsWith('## ')) {
                    if (listOpen) html.push('</ul>');
                    listOpen = false;
                    html.push(`<h2>${escapeHTML(trimmed.slice(3))}</h2>`);
                } else if (trimmed.startsWith('### ')) {
                    if (listOpen) html.push('</ul>');
                    listOpen = false;
                    html.push(`<h3>${escapeHTML(trimmed.slice(4))}</h3>`);
                } else if (/^[-*]\s+/.test(trimmed)) {
                    if (!listOpen) {
                        html.push('<ul>');
                        listOpen = true;
                    }
                    html.push(`<li>${escapeHTML(trimmed.replace(/^[-*]\s+/, ''))}</li>`);
                } else {
                    if (listOpen) {
                        html.push('</ul>');
                        listOpen = false;
                    }
                    html.push(`<p>${escapeHTML(trimmed)}</p>`);
                }
            });

            if (listOpen) html.push('</ul>');
            return html.join('');
        }

        // Add message to chat with animation
        function addMessage(text, isUser = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;
            
            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = `message-bubble ${isUser ? 'user' : 'bot'}`;
            bubbleDiv.textContent = text;
            
            messageDiv.appendChild(bubbleDiv);
            chatContainer.appendChild(messageDiv);
            
            // Scroll to bottom
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Track rendered status-card DOM nodes by id so that if progress_plan
        // arrives after a card was rendered with fallback text, we can update
        // the title/detail in place instead of leaving stale labels.
        const renderedStatusNodes = new Map();

        function statusCardHTML(status) {
            return `
                <span class="agent-status-icon">✓</span>
                <span>
                    <strong>${escapeHTML(status.title)}</strong>
                    <span class="agent-status-detail">${escapeHTML(status.detail)}</span>
                </span>
            `;
        }

        function addStatusMessage(statusId) {
            const status = statusMessageFor(statusId);
            if (!status) return;

            const existing = renderedStatusNodes.get(statusId);
            if (existing) {
                existing.innerHTML = statusCardHTML(status);
                return;
            }

            renderedStatusMessages.add(statusId);

            const messageDiv = document.createElement('div');
            messageDiv.className = 'message bot';

            const statusDiv = document.createElement('div');
            statusDiv.className = 'agent-status-message';
            statusDiv.innerHTML = statusCardHTML(status);

            renderedStatusNodes.set(statusId, statusDiv);
            messageDiv.appendChild(statusDiv);
            chatContainer.appendChild(messageDiv);
            keepSpinnerAtBottom();
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function keepSpinnerAtBottom() {
            if (spinnerContainer.style.display !== 'none') {
                chatContainer.appendChild(spinnerContainer);
            }
        }

        function clearStatusTimers() {
            statusTimers.forEach((timer) => clearTimeout(timer));
            statusTimers = [];
        }

        function startAgentStatusMessages() {
            setAgentStatus('Researching');
            addStatusMessage('planning');
            // 'collecting' and 'writing' are no longer fired on a fixed timer -
            // they're driven by the orchestrator's current_activity polled from
            // the workflow (see pollStatus). 'writing' is also force-rendered at
            // completion via finishAgentStatusMessages as a safety net.
        }

        function applyCurrentActivity(activity) {
            if (!activity) return;
            if (activity === 'planning') {
                addStatusMessage('planning');
            } else if (activity === 'collecting') {
                addStatusMessage('planning');
                addStatusMessage('collecting');
            } else if (activity === 'writing') {
                addStatusMessage('planning');
                addStatusMessage('collecting');
                addStatusMessage('writing');
            }
        }

        function finishAgentStatusMessages() {
            clearStatusTimers();
            ['planning', 'collecting', 'writing'].forEach((id) => addStatusMessage(id));
            setAgentStatus('Report ready', true);
        }

        function normalizeImagePath(path) {
            if (!path) return '';
            if (path.startsWith('http') || path.startsWith('/')) return path;
            return path;
        }

        function deriveReportTitle(result) {
            const markdown = result && result.markdown_report;
            if (markdown) {
                const match = markdown.match(/^\s*#\s+(.+?)\s*$/m);
                if (match) return match[1].trim();
            }
            return 'Research summary';
        }

        function addReportCard(result, currentWorkflowId) {
            if (reportRendered) return;
            reportRendered = true;

            const messageDiv = document.createElement('div');
            messageDiv.className = 'message bot report-message';

            const card = document.createElement('article');
            card.className = 'report-card';
            card.tabIndex = 0;
            card.setAttribute('role', 'button');
            card.setAttribute('aria-expanded', 'false');

            const imagePath = normalizeImagePath(result.image_file_path || '');
            const imageHTML = imagePath
                ? `<img class="report-card-image" src="${escapeHTML(imagePath)}" alt="AI-generated research visualization">`
                : '<div class="report-card-image report-card-image-placeholder">Report</div>';
            const summary = result.short_summary || 'A concise summary report is ready to review.';
            const title = deriveReportTitle(result);

            card.innerHTML = `
                <div class="report-card-main">
                    ${imageHTML}
                    <div class="report-card-copy">
                        <span class="report-card-eyebrow">Report ready</span>
                        <h2>${escapeHTML(title)}</h2>
                        <p>${escapeHTML(summary)}</p>
                    </div>
                </div>
                <div class="report-card-action">
                    <span>Open markdown report</span>
                    <span class="report-card-arrow">↗</span>
                </div>
                <div class="report-panel" hidden>
                    <div class="report-panel-actions">
                        <button type="button" class="report-download-btn">Download markdown</button>
                        <a href="success?wf=${encodeURIComponent(currentWorkflowId || '')}" class="report-full-link">Open full page</a>
                    </div>
                    <div class="markdown-content compact"></div>
                </div>
            `;

            const panel = card.querySelector('.report-panel');
            const markdown = card.querySelector('.markdown-content');
            markdown.innerHTML = convertMarkdownToHTML(result.markdown_report || summary);

            function toggleReport() {
                const isOpen = !panel.hidden;
                panel.hidden = isOpen;
                card.setAttribute('aria-expanded', String(!isOpen));
                document.body.classList.toggle('report-open', !isOpen);
                if (!isOpen) {
                    setTimeout(() => {
                        card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                    }, 0);
                }
            }

            card.addEventListener('click', (event) => {
                if (event.target.closest('a') || event.target.closest('button')) return;
                // Allow normal interaction (text selection, clicks) inside the
                // expanded panel; only the collapsed surface toggles the card.
                if (event.target.closest('.report-panel')) return;
                toggleReport();
            });

            card.addEventListener('keydown', (event) => {
                if (event.target !== card) return;
                if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    toggleReport();
                }
            });

            const downloadBtn = card.querySelector('.report-download-btn');
            downloadBtn.addEventListener('click', (event) => {
                event.stopPropagation();
                downloadMarkdown(result.markdown_report || summary, currentWorkflowId);
            });

            messageDiv.appendChild(card);
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function downloadMarkdown(content, currentWorkflowId) {
            const blob = new Blob([content], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `research-report-${currentWorkflowId || 'result'}.md`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function resetChat() {
            // Clears DOM and per-render state that is rebuilt by whatever
            // calls this. Note: agentProgressPlan is NOT cleared here, since
            // resumeActiveWorkflow sets the fetched plan before calling
            // renderTranscript -> resetChat, and the plan needs to survive
            // that round-trip. startFreshChat clears it explicitly.
            chatContainer.innerHTML = '';
            renderedStatusMessages.clear();
            renderedStatusNodes.clear();
            renderedElicitationIds.clear();
            reportRendered = false;
            document.body.classList.remove('report-open');
        }

        function setResearchComplete(complete) {
            researchComplete = complete;
            document.body.classList.toggle('research-complete', complete);
            userInput.placeholder = complete ? POST_COMPLETE_PLACEHOLDER : INITIAL_PLACEHOLDER;
        }

        function startFreshChat() {
            // Invalidate any in-flight pollStatus loops so they exit on next tick.
            pollGeneration += 1;
            workflowId = null;
            client.workflowId = null;
            pendingElicitation = null;
            renderedElicitationIds.clear();
            researchingStarted = false;
            clearStatusTimers();
            clearInterval(retryCheckInterval);
            spinnerContainer.classList.remove('retrying');
            showSpinner(false);
            localStorage.removeItem(ACTIVE_WORKFLOW_KEY);
            setWorkflowURL(null);
            agentProgressPlan = null;
            resetChat();
            addMessage('What would you like me to research?');
            setAgentStatus('Ready');
            setResearchComplete(false);
            userInput.value = '';
            userInput.focus();
        }

        function renderTranscript(status) {
            resetChat();
            addMessage('What would you like me to research?');

            if (status.original_query) {
                addMessage(status.original_query, true);
            }

            // Replay completed elicitations as Q/A pairs.
            const completed = status.completed_elicitations || [];
            completed.forEach((el) => {
                addMessage(el.message);
                if (el.response) {
                    addMessage(el.response, true);
                }
                renderedElicitationIds.add(el.id);
            });

            // If there's a pending elicitation, render its question.
            if (status.pending_elicitation) {
                addMessage(status.pending_elicitation.message);
                renderedElicitationIds.add(status.pending_elicitation.id);
            }
        }

        // Show/hide spinner
        function showSpinner(visible) {
            if (visible && spinnerContainer.parentElement !== chatContainer) {
                chatContainer.appendChild(spinnerContainer);
            }

            spinnerContainer.style.display = visible ? 'flex' : 'none';
            if (visible) {
                spinnerStartTime = Date.now();
                spinnerContainer.classList.remove('retrying');
                document.querySelector('.researching-text').textContent = 'Agent is thinking...';
                chatContainer.appendChild(spinnerContainer);
                chatContainer.scrollTop = chatContainer.scrollHeight;
                clearInterval(retryCheckInterval);
                retryCheckInterval = setInterval(() => {
                    if (Date.now() - spinnerStartTime > 5000) {
                        spinnerContainer.classList.add('retrying');
                        document.querySelector('.researching-text').textContent = 'Still researching...';
                        chatContainer.scrollTop = chatContainer.scrollHeight;
                        clearInterval(retryCheckInterval);
                    }
                }, 1000);
            } else {
                spinnerContainer.classList.remove('retrying');
                clearInterval(retryCheckInterval);
            }
        }

        // Handle form submission
        async function handleSubmit() {
            const query = userInput.value.trim();
            if (!query) return;

            if (researchComplete) {
                startFreshChat();
            }

            // Add user message (animates in as indigo right-aligned bubble)
            addMessage(query, true);
            userInput.value = '';

            // Show spinner
            showSpinner(true);
            setAgentStatus('Starting');

            try {
                if (!workflowId) {
                    // First submission - start new research workflow
                    const result = await client.startResearch(query);
                    workflowId = result.workflow_id;
                    localStorage.setItem(ACTIVE_WORKFLOW_KEY, workflowId);
                    setWorkflowURL(workflowId);
                } else if (pendingElicitation) {
                    // Subsequent submissions answer the current pending elicitation.
                    await client.submitElicitationResponse(
                        query, pendingElicitation.id, workflowId
                    );
                    pendingElicitation = null;
                } else {
                    console.warn('Submit ignored: no pending elicitation to respond to.');
                }

                // Poll for next status
                pollStatus();

            } catch (error) {
                console.error('Error:', error);
                showSpinner(false);
                addMessage('Sorry, something went wrong. Please try again.');
            }
        }

        // Poll for workflow status. Each invocation captures the current pollGeneration;
        // if it changes (because the user reset or started a new run), we exit silently
        // to avoid duplicate side effects and orphan loops.
        async function pollStatus(generation = pollGeneration) {
            if (generation !== pollGeneration || !workflowId) return;
            try {
                const status = await client.getStatus(workflowId);
                if (generation !== pollGeneration) return;

                // The orchestrator commits a topic-specific progress_plan on
                // its first tool call; pick it up as soon as it arrives and
                // refresh any cards that were already rendered with fallback
                // text so they pick up the agent's labels.
                if (status.progress_plan && status.progress_plan !== agentProgressPlan) {
                    agentProgressPlan = status.progress_plan;
                    renderedStatusNodes.forEach((_, id) => addStatusMessage(id));
                }

                if (status.status === 'awaiting_user_input' && status.pending_elicitation) {
                    pendingElicitation = status.pending_elicitation;
                    setAgentStatus('Needs input');
                    showSpinner(false);
                    if (!renderedElicitationIds.has(pendingElicitation.id)) {
                        addMessage(pendingElicitation.message);
                        renderedElicitationIds.add(pendingElicitation.id);
                    }
                } else if (status.status === 'researching') {
                    // First entry into researching: do the one-time setup. Subsequent polls
                    // are no-ops here — re-appending the spinner each tick re-triggered the
                    // slideIn animation and made the row blink.
                    if (!researchingStarted) {
                        researchingStarted = true;
                        const txt = document.querySelector('.researching-text');
                        if (txt.textContent !== 'Agent is researching...') {
                            txt.textContent = 'Agent is researching...';
                        }
                        // Note: we deliberately leave retryCheckInterval running. After
                        // ~5s of continuous spinner, it flips the row amber with
                        // "Still researching..." — a generic "this is taking a while"
                        // signal that also covers the worker-crash recovery moment.
                        startAgentStatusMessages();
                        keepSpinnerAtBottom();
                        chatContainer.scrollTop = chatContainer.scrollHeight;
                    }
                    // Surface the orchestrator's current phase as a progress message.
                    applyCurrentActivity(status.current_activity);
                    // Keep polling
                    setTimeout(() => pollStatus(generation), 1000);

                } else if (status.status === 'completed') {
                    // Research complete - keep the result inside the conversation
                    showSpinner(false);
                    finishAgentStatusMessages();
                    const result = await client.getResult(workflowId);
                    if (generation !== pollGeneration) return;

                    sessionStorage.setItem('researchResult', JSON.stringify(result));
                    sessionStorage.setItem('workflowId', workflowId);
                    localStorage.removeItem(ACTIVE_WORKFLOW_KEY);

                    addMessage('I finished the research. The report is ready to review.');
                    addReportCard(result, workflowId);
                    setResearchComplete(true);

                } else {
                    // Other states - keep polling
                    setTimeout(() => pollStatus(generation), 1000);
                }
            } catch (error) {
                if (generation !== pollGeneration) return;
                console.error('Polling error:', error);
                setTimeout(() => pollStatus(generation), 2000);
            }
        }

        // Event listeners
        submitButton.addEventListener('click', handleSubmit);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleSubmit();
            }
        });
        resetButton.addEventListener('click', startFreshChat);

        async function resumeActiveWorkflow() {
            // URL ?wf=<id> wins; localStorage is the legacy/in-tab fallback.
            const activeWorkflowId = workflowIdFromURL() || localStorage.getItem(ACTIVE_WORKFLOW_KEY);
            if (!activeWorkflowId) return;

            workflowId = activeWorkflowId;
            client.workflowId = activeWorkflowId;
            // Sync state across both sources so a hand-typed URL also survives a reload
            // without the URL, and a localStorage-resumed run gets a copyable URL.
            localStorage.setItem(ACTIVE_WORKFLOW_KEY, activeWorkflowId);
            if (workflowIdFromURL() !== activeWorkflowId) {
                setWorkflowURL(activeWorkflowId);
            }

            try {
                const status = await client.getStatus(workflowId);
                if (status.progress_plan) {
                    agentProgressPlan = status.progress_plan;
                }
                renderTranscript(status);

                if (status.status === 'completed') {
                    showSpinner(false);
                    const result = await client.getResult(workflowId);
                    sessionStorage.setItem('researchResult', JSON.stringify(result));
                    sessionStorage.setItem('workflowId', workflowId);
                    localStorage.removeItem(ACTIVE_WORKFLOW_KEY);
                    finishAgentStatusMessages();
                    addMessage('I finished the research. The report is ready to review.');
                    addReportCard(result, workflowId);
                    setResearchComplete(true);
                } else if (status.status === 'awaiting_user_input' && status.pending_elicitation) {
                    pendingElicitation = status.pending_elicitation;
                    setAgentStatus('Needs input');
                    showSpinner(false);
                    pollStatus();
                } else if (status.status === 'researching' || status.status === 'pending') {
                    showSpinner(true);
                    document.querySelector('.researching-text').textContent =
                        status.status === 'researching' ? 'Agent is researching...' : 'Agent is thinking...';
                    if (status.status === 'researching') {
                        startAgentStatusMessages();
                    }
                    pollStatus();
                }
            } catch (error) {
                console.error('Resume error:', error);
                localStorage.removeItem(ACTIVE_WORKFLOW_KEY);
                setWorkflowURL(null);
                workflowId = null;
                client.workflowId = null;
                pendingElicitation = null;
                renderedElicitationIds.clear();
                showSpinner(false);
            }
        }

        function renderDemoComplete() {
            const demoWorkflowId = 'interactive-research-demo';
            const demoResult = {
                short_summary: 'A concise analysis of uneven recovery across corridors, businesses, and transit access.',
                markdown_report: `# Post-COVID Recovery in SF Neighborhoods

## Summary
San Francisco neighborhoods are recovering unevenly. Foot traffic has improved in several commercial corridors, but the recovery depends heavily on transit access, office occupancy, and local business mix.

## Key Findings
- Foot traffic is recovering unevenly across neighborhoods.
- Small businesses are rebounding faster in corridors with steady local demand.
- Transit access remains a major factor in neighborhood recovery patterns.

## Suggested Follow-Ups
- Compare recovery by commercial corridor.
- Add residential demand and office occupancy signals.
- Re-run the analysis for 2024-2026 only.`,
                follow_up_questions: [],
                image_file_path: 'static/public/images/placeholder.png',
            };

            resetChat();
            workflowId = demoWorkflowId;
            setAgentStatus('Report ready', true);
            sessionStorage.setItem('researchResult', JSON.stringify(demoResult));
            sessionStorage.setItem('workflowId', demoWorkflowId);

            addMessage('What would you like me to research?');
            addMessage('Research post-COVID recovery in San Francisco neighborhoods.', true);
            addMessage('What should I focus on?');
            addMessage('Compare foot traffic, small businesses, and transit access. Include a summary report.', true);
            finishAgentStatusMessages();
            addMessage('I finished the research. The report is ready to review.');
            addReportCard(demoResult, demoWorkflowId);
            setResearchComplete(true);
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (DEMO_MODE === 'complete') {
                renderDemoComplete();
                return;
            }

            resumeActiveWorkflow();
        });
    </script>
</body>
</html>
