<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Report - Deep Research Agent</title>
    <link rel="stylesheet" href="static/src/css/styles.css">
</head>
<body class="report-page">
    <main class="report-shell">
        <header class="report-header">
            <div>
                <a class="report-back-link" href="/">Back to conversation</a>
                <h1>Deep Research Agent</h1>
            </div>
            <span class="agent-status report-status">
                <span class="agent-status-dot complete"></span>
                <span>Report ready</span>
            </span>
        </header>

        <section class="report-hero">
            <img class="report-hero-image" alt="AI-generated research visualization" src="static/public/images/placeholder.png">
            <div class="report-hero-copy">
                <span class="report-card-eyebrow">Markdown report</span>
                <h2 id="reportTitle">Research report</h2>
                <p id="reportSummary">Loading report...</p>
                <button type="button" class="report-download-btn" id="downloadReportBtn" disabled>
                    Download markdown
                </button>
            </div>
        </section>

        <section class="full-report-panel">
            <div class="markdown-content" id="markdownContent">
                <p>Loading report...</p>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/lib/marked.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked-gfm-heading-id@4.1.1/lib/index.umd.min.js"></script>
    <script src="static/src/js/api-client.js"></script>
    <script>
        const API_BASE_URL = 'http://localhost:8234';
        const client = new ResearchClient(API_BASE_URL);
        const markdownContent = document.getElementById('markdownContent');
        const reportImage = document.querySelector('.report-hero-image');
        const reportTitle = document.getElementById('reportTitle');
        const reportSummary = document.getElementById('reportSummary');
        const downloadBtn = document.getElementById('downloadReportBtn');

        marked.use(markedGfmHeadingId.gfmHeadingId());

        function normalizeMarkdown(markdown = '') {
            return markdown.replace(/~(?=\d)/g, 'approximately ');
        }

        function titleFromMarkdown(markdown = '') {
            const heading = markdown.match(/^#\s+(.+)$/m);
            return heading ? heading[1].trim() : 'Research report';
        }

        function downloadMarkdown(content, workflowId) {
            const blob = new Blob([content], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `research-report-${workflowId || 'result'}.md`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        async function loadResearchResult() {
            const params = new URLSearchParams(window.location.search);
            const workflowIdFromUrl = params.get('wf');
            const storedWorkflowId = sessionStorage.getItem('workflowId');
            const storedResult = sessionStorage.getItem('researchResult');
            let workflowId = workflowIdFromUrl || storedWorkflowId;
            let resultJson = null;

            if (storedResult && (!workflowIdFromUrl || storedWorkflowId === workflowIdFromUrl)) {
                resultJson = storedResult;
            }

            if (!resultJson && workflowId) {
                const result = await client.getResult(workflowId);
                resultJson = JSON.stringify(result);
                sessionStorage.setItem('researchResult', resultJson);
                sessionStorage.setItem('workflowId', workflowId);
            }

            if (!resultJson) {
                throw new Error('No report result found');
            }

            const result = JSON.parse(resultJson);
            const markdown = result.markdown_report || '# Research report\n\nNo markdown report was returned.';

            reportTitle.textContent = titleFromMarkdown(markdown);
            reportSummary.textContent = result.short_summary || 'The research report is ready to review.';
            markdownContent.innerHTML = marked.parse(normalizeMarkdown(markdown));

            if (result.image_file_path) {
                reportImage.src = result.image_file_path;
            }

            downloadBtn.disabled = false;
            downloadBtn.addEventListener('click', () => {
                downloadMarkdown(markdown, workflowId);
            });
        }

        loadResearchResult().catch((error) => {
            console.error('Error loading report:', error);
            reportTitle.textContent = 'Report unavailable';
            reportSummary.textContent = 'Return to the conversation and open the report again after the research completes.';
            markdownContent.innerHTML = '<p>Report data was not available for this page.</p>';
            downloadBtn.disabled = true;
        });
    </script>
</body>
</html>
