[project]
name = "openai-agents-demos"
version = "0.1.0"
description = "OpenAI Agents Python SDK Demo Repository"
authors = [{ name = "Steve Androulakis", email = "steve.androulakis@temporal.io" }]
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
dependencies = [
    "temporalio>=1.27.0,<2",
    "openai-agents>=0.14.6,<0.16",
    # temporalio 1.27.0's contrib.openai_agents transitively imports
    # contrib.opentelemetry, so we need both extras together.
    "temporalio[openai-agents,opentelemetry]>=1.27.0",
    "pydantic>=2.13.0,<3",
    "dotenv>=0.9.9",
    "fastapi>=0.136.0",
    "uvicorn>=0.37.0",
    # openai-agents 0.14.6 imports `from griffe import Docstring,
    # DocstringSectionKind` but its declared dep on `griffelib` is an empty
    # placeholder. Pin griffe<2 (1.x has the expected API) until upstream fixes.
    "griffe>=1.0,<2",
]

[project.urls]
Homepage = "https://github.com/jssmith/openai-agents-sdk-deep-research-demo"
Repository = "https://github.com/jssmith/openai-agents-sdk-deep-research-demo"
Documentation = "https://docs.temporal.io/develop/python"

[dependency-groups]
dev = [
    "black>=22.3.0,<23",
    "isort>=5.10.1,<6",
    "mypy>=1.4.1,<2",
    "pytest>=7.1.2,<8",
    "pytest-asyncio>=0.18.3,<0.19",
    "pyright>=1.1.394",
    "rich>=13.1.0, <14",
]

[tool.uv]
default-groups = ["dev"]
# Override the global 7-day cooldown for temporalio — we want 1.27.0
# (published 2026-04-30) for the agentic refactor work.
exclude-newer-package = { temporalio = "2026-05-03" }

[tool.isort]
profile = "black"
skip_gitignore = true

[tool.mypy]
ignore_missing_imports = true
namespace_packages = true
exclude = ["^legacy/"]

[tool.pyright]
exclude = ["legacy", "**/node_modules", "**/__pycache__", "**/.*"]

[tool.hatch.build.targets.wheel]
packages = ["openai_agents"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
