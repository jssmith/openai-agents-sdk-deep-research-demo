[project]
name = "openai-agents-demos"
version = "0.1.0"
description = "OpenAI Agents Python SDK Demo Repository"
authors = [{ name = "Steve Androulakis", email = "steve.androulakis@temporal.io" }]
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
dependencies = [
    # 1.28.0 is the first release with the agents payload-converter fix
    # (PR #1563) that tolerates OpenAI response schema drift; 1.27.0 wedges
    # workflows on a web_search_call that omits `action`.
    "temporalio>=1.28.0,<2",
    # 0.18.1 fixes Usage() raising under openai>=2.45 (cache_write_tokens).
    "openai-agents>=0.18.1,<0.19",
    # temporalio's contrib.openai_agents transitively imports
    # contrib.opentelemetry, so we need both extras together.
    "temporalio[openai-agents,opentelemetry]>=1.28.0",
    "pydantic>=2.13.0,<3",
    "dotenv>=0.9.9",
    "fastapi>=0.136.0",
    "uvicorn>=0.37.0",
    # openai-agents 0.14.6 imports `from griffe import Docstring,
    # DocstringSectionKind` but its declared dep on `griffelib` is an empty
    # placeholder. Pin griffe<2 (1.x has the expected API) until upstream fixes.
    "griffe>=1.0,<2",
]

[project.urls]
Homepage = "https://github.com/jssmith/openai-agents-sdk-deep-research-demo"
Repository = "https://github.com/jssmith/openai-agents-sdk-deep-research-demo"
Documentation = "https://docs.temporal.io/develop/python"

[dependency-groups]
dev = [
    "black>=22.3.0,<23",
    "isort>=5.10.1,<6",
    "mypy>=1.4.1,<2",
    "pytest>=7.1.2,<8",
    "pytest-asyncio>=0.18.3,<0.19",
    "pyright>=1.1.394",
    "rich>=13.1.0, <14",
    "ruff>=0.15,<0.16",
]

[tool.uv]
default-groups = ["dev"]
# Don't install packages published in the last 7 days.
exclude-newer = "7 days"

[tool.isort]
profile = "black"
skip_gitignore = true

[tool.mypy]
ignore_missing_imports = true
namespace_packages = true
exclude = ["^legacy/"]

[tool.pyright]
exclude = ["legacy", "**/node_modules", "**/__pycache__", "**/.*"]

[tool.hatch.build.targets.wheel]
packages = ["openai_agents"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
