[project]
name = "openai-agents-demos"
version = "0.1.0"
description = "OpenAI Agents Python SDK Demo Repository"
authors = [{ name = "Steve Androulakis", email = "steve.androulakis@temporal.io" }]
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
dependencies = [
    # 1.28.0 is the first release with the agents payload-converter fix
    # (PR #1563) that tolerates OpenAI response schema drift; 1.27.0 wedges
    # workflows on a web_search_call that omits `action`.
    "temporalio>=1.28.0,<2",
    "openai-agents>=0.17.5,<0.19",
    # openai-agents 0.18.0's Usage() default builds InputTokensDetails without
    # cache_write_tokens, which openai 2.45.0 made a required field, so Usage()
    # raises at runtime. Cap openai below 2.45 (the fix in openai-agents 0.18.1
    # is still inside the 7-day cooldown). Lift the cap once >=0.18.1 is usable.
    "openai>=2.36,<2.45",
    # temporalio's contrib.openai_agents transitively imports
    # contrib.opentelemetry, so we need both extras together.
    "temporalio[openai-agents,opentelemetry]>=1.28.0",
    "pydantic>=2.13.0,<3",
    "pillow>=11.0.0",
    "dotenv>=0.9.9",
    "fastapi>=0.136.0",
    "uvicorn>=0.37.0",
    # openai-agents 0.14.6 imports `from griffe import Docstring,
    # DocstringSectionKind` but its declared dep on `griffelib` is an empty
    # placeholder. Pin griffe<2 (1.x has the expected API) until upstream fixes.
    "griffe>=1.0,<2",
]

[project.urls]
Homepage = "https://github.com/jssmith/openai-agents-sdk-deep-research-demo"
Repository = "https://github.com/jssmith/openai-agents-sdk-deep-research-demo"
Documentation = "https://docs.temporal.io/develop/python"

[dependency-groups]
dev = [
    "black>=22.3.0,<23",
    "isort>=5.10.1,<6",
    "mypy>=1.4.1,<2",
    "pytest>=7.1.2,<8",
    "pytest-asyncio>=0.18.3,<0.19",
    "pyright>=1.1.394",
    "rich>=13.1.0, <14",
    "ruff>=0.15,<0.16",
]

[tool.uv]
default-groups = ["dev"]
# No temporalio cooldown override: it falls under the global 7-day cooldown
# like every other package. (Previously pinned to pre-2026-05-03 / 1.27.0,
# which had the agents payload-converter poison-pill bug fixed in 1.28.0.)

[tool.isort]
profile = "black"
skip_gitignore = true

[tool.mypy]
ignore_missing_imports = true
namespace_packages = true
exclude = ["^legacy/"]

[tool.pyright]
exclude = ["legacy", "**/node_modules", "**/__pycache__", "**/.*"]

[tool.hatch.build.targets.wheel]
packages = ["openai_agents"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
